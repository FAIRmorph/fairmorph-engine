[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmorph-engine"
version = "0.0.2"
authors = [
  { name="FAIRmorph", email="pypi@kreativmanufaktur.de" },
]
description = "Core engine for transforming ecology observation and measurement data into interoperable data formats to support FAIR principles (Active development starting soon)"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 1 - Planning",
]

[project.urls]
"Homepage" = "https://github.com/fairmorph/fairmorph-engine"
