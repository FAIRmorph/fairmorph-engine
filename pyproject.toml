[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmorph-engine"
version = "0.0.2"
description = "Core engine for transforming ecology observation and measurement data into interoperable data formats to support FAIR principles (Active development starting soon)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  { name = "FAIRmorph", email = "pypi@kreativmanufaktur.de" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 1 - Planning",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build",
    "twine",
]

[project.urls]
"Homepage" = "https://github.com/fairmorph/fairmorph-engine"

[project.scripts]
fairmorph-engine = "fairmorph_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
