name: Update fairmorph.org documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '.github/workflows/docs-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-dispatch-main
  cancel-in-progress: true

jobs:
  notify-portal:
    name: Notify documentation portal
    runs-on: ubuntu-latest
    steps:
      - name: Generate short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: FAIRmorph
          repositories: fairmorph.org

      - name: Request documentation rebuild
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"event_type":"code-updated","client_payload":{"repository":"%s","commit":"%s"}}' "$SOURCE_REPOSITORY" "$SOURCE_COMMIT")
          curl --fail-with-body --show-error --silent --retry 3 \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $APP_TOKEN" \
            https://api.github.com/repos/FAIRmorph/fairmorph.org/dispatches \
            -d "$payload"
          echo "Requested documentation rebuild for $SOURCE_REPOSITORY at $SOURCE_COMMIT"
