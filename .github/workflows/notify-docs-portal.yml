name: Notify fairmorph.org of documentation updates

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.mdx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger documentation portal rebuild
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.FAIRMORPH_DOCS_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOCS_DISPATCH_TOKEN" ]]; then
            echo "::error::Set FAIRMORPH_DOCS_DISPATCH_TOKEN (with dispatch permission for FAIRmorph/fairmorph.org) as an Actions secret."
            exit 1
          fi
          payload=$(printf '{"event_type":"docs-updated","client_payload":{"source":"%s","sha":"%s"}}' "$SOURCE_REPOSITORY" "$SOURCE_SHA")
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST https://api.github.com/repos/FAIRmorph/fairmorph.org/dispatches \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            --data "$payload"
          echo "Triggered fairmorph.org docs refresh from $SOURCE_REPOSITORY at $SOURCE_SHA"
