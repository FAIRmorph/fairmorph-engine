name: CS-PHOC reference PoC

on:
  pull_request:
  workflow_dispatch:

jobs:
  reference-workflow:
    name: project reference workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check project test formatting
        run: |
          ruff check examples/cs-phoc/tests
          ruff format --check examples/cs-phoc/tests
      - name: Run project-owned reference acceptance test
        run: python -m pytest examples/cs-phoc/tests/test_reference_workflow.py
