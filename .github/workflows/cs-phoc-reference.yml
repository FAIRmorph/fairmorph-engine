name: CS-PHOC external reference regression

on:
  workflow_dispatch:

jobs:
  reference-regression:
    name: Engine CSV mapping regression
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify CS-PHOC mapping workflow and Data Package
        run: python -m pytest -q examples/cs-phoc/tests/test_reference_workflow.py
