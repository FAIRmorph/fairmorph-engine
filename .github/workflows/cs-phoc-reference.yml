name: CS-PHOC external reference regression

on:
  pull_request:
    paths:
      - "src/**"
      - "contracts/**"
      - "examples/cs-phoc/**"
      - ".github/workflows/cs-phoc-reference.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  reference-regression:
    name: External reference regression
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run external CS-PHOC regression
        run: python -m pytest -q examples/cs-phoc/tests/test_reference_workflow.py
